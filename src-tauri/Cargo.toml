[package]
name = "aegis-browser"
version = "1.3.0"
description = "Aegis Browser"
authors = ["Aegis"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-updater = "2"
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "5.0"
urlencoding = "2.1"
tauri-plugin-dialog = "2"
rfd = "0.15"
portable-pty = "0.8"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
debug = false


